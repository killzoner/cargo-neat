args = ["--help"]
bin.name = "cargo-neat"
status.code = 0
stderr = ""
stdout = """
Usage: cargo-neat [--version] [-m] [-p] [--package-workspace-meta-values <package-workspace-meta-values>] [-f] [path]

cargo-neat: Keep your cargo workspace neat

Exit code:
    0:  when no issue is found
    1:  when at least one issue is found
    2:  on error

Options:
  --version         print version.
  -m, --mandatory-workspace-dependencies
                    allow only workspace dependency (ie "workspace = true")
  -p, --package-workspace-meta
                    mandatory workspace package metadata keys (ie "authors" for
                    package.authors.workspace = true )
  --package-workspace-meta-values
                    keys for checking mandatory workspace package metadata,
                    resolved in order: cli, then
                    workspace.metadata.cargo-neat.meta-values, then default (see
                    README).
  -f, --mandatory-no-default-features
                    always use explicit feature (ie "default-features = false")
  --help, help      display usage information

"""
