args = ["--help"]
bin.name = "cargo-neat"
status.code = 0
stderr = ""
stdout = """
Usage: cargo-neat [--version] [-m] [-p] [--package-workspace-meta-values <package-workspace-meta-values>] [path]

cargo-neat: Remove unused workspace dependencies

Exit code:
    0:  when no unused dependencies are found
    1:  when at least one unused dependency is found
    2:  on error

Options:
  --version         print version.
  -m, --mandatory-workspace-dependencies
                    allow only workspace dependency (ie "workspace = true")
  -p, --package-workspace-meta
                    mandatory workspace package metadata keys (ie "authors" for
                    package.authors.workspace = true )
  --package-workspace-meta-values
                    keys for checking mandatory workspace package metadata,
                    defaults to
                    "rust-version,edition,license,homepage,repository"
  --help, help      display usage information

"""
