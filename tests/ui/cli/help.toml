args = ["--help"]
bin.name = "cargo-neat"
status.code = 0
stderr = ""
stdout = """
Usage: cargo-neat [--version] [-m] [-p] [--package-workspace-meta-values <package-workspace-meta-values>] [-f] [path]

cargo-neat: Keep your cargo workspace neat

Exit code:
    0:  when no issue is found
    1:  when at least one issue is found
    2:  on error

Options:
  --version         print version
  -m, --mandatory-workspace-dependencies
                    require dependencies to be inherited (ie "workspace = true")
  -p, --package-workspace-meta
                    require declared package metadata keys to be inherited (ie
                    "authors" for package.authors.workspace = true)
  --package-workspace-meta-values
                    keys checked by --package-workspace-meta, resolved in order:
                    cli, then
                    workspace.metadata.cargo-neat.package-workspace-meta-values,
                    then default (see README)
  -f, --mandatory-no-default-features
                    require opting out of default features (ie "default-features
                    = false")
  --help, help      display usage information

"""
